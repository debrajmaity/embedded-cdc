# PostgreSQL CDC Configuration
# =============================

# PostgreSQL Connection Settings
postgres.hostname=localhost
postgres.port=5432
postgres.username=postgres
postgres.password=
postgres.database=postgres

# Schema to monitor
postgres.schema=public

# Replication Settings
# --------------------
# Logical replication slot name (will be created if it doesn't exist)
postgres.slotName=embedded_cdc_slot

# Publication name (will be created if it doesn't exist)
postgres.publicationName=embedded_cdc_publication

# Decoding plugin: pgoutput (PostgreSQL 10+), wal2json, etc.
postgres.decodingPlugin=pgoutput

# Starting LSN (Log Sequence Number)
# Leave empty to start from the current position
postgres.startLsn=

# Table Filtering
# ---------------
# Comma-separated list of tables to include (empty means all tables)
# Example: users,orders,products
postgres.includeTables=

# Comma-separated list of tables to exclude
postgres.excludeTables=

# Connection Settings
# -------------------
postgres.keepAlive=true
postgres.keepAliveInterval=60000
postgres.heartbeatInterval=30000
