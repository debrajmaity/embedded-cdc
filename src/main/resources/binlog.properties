# MySQL Connection Settings
mysql.hostname=localhost
mysql.port=3306
mysql.username=root
mysql.password=

# Binlog Position (optional - leave empty to start from current position)
binlog.filename=
binlog.position=

# Connection Settings
binlog.keepAlive=true
binlog.keepAliveInterval=60000
binlog.heartbeatInterval=30000

# Filtering (optional - comma-separated)
# binlog.databases=mydb,testdb
# binlog.tables=users,orders
